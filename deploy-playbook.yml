---
- name: Deploy Flask MySQL app with docker-compose
  hosts: all
  become: true

  tasks:
    - name: Ensure app directory exists
      file:
        path: /home/ubuntu/app
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml to server
      copy:
        src: docker-compose.yml
        dest: /home/ubuntu/app/docker-compose.yml

    - name: Copy init.sql to server
      copy:
        src: init.sql
        dest: /home/ubuntu/app/init.sql

    - name: Check if docker compose plugin is installed
      command: docker compose version
      register: compose_check
      ignore_errors: true
      changed_when: false

    - name: Install Docker Compose plugin manually
      when: compose_check.rc != 0
      block:
        - name: Create docker cli-plugins directory
          file:
            path: /usr/local/lib/docker/cli-plugins
            state: directory
            mode: '0755'

        - name: Download docker-compose binary
          get_url:
            url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
            dest: /usr/local/lib/docker/cli-plugins/docker-compose
            mode: '0755'

    - name: Pull latest images
      command: docker compose pull
      args:
        chdir: /home/ubuntu/app

    - name: Stop existing stack (if any)
      command: docker compose down
      args:
        chdir: /home/ubuntu/app
      ignore_errors: true

    - name: Start stack with docker compose
      command: docker compose up -d
      args:
        chdir: /home/ubuntu/app
